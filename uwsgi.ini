[uwsgi]
chdir = /data/project/pollaris/www/python/src
virtualenv = /data/project/pollaris/www/python/venv
module = config.wsgi:application

master = true
processes = 2
threads = 2
vacuum = true
die-on-term = true
max-requests = 5000
buffer-size = 65535
env = DJANGO_SETTINGS_MODULE=config.settings

static-map = /assets=/data/project/pollaris/www/python/src/staticfiles
static-map = /icons.svg=/data/project/pollaris/www/python/src/staticfiles/icons.svg
static-map = /calendar.png=/data/project/pollaris/www/python/src/staticfiles/calendar.png
static-map = /screenshot.webp=/data/project/pollaris/www/python/src/staticfiles/screenshot.webp
